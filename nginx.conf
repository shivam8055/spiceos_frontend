server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never let browsers/CDNs keep an old Flutter shell after a deployment.
    # Hashed Flutter assets remain cacheable; the HTML/bootstrap entry points do not.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # main.dart.js is Flutter's un-hashed application bundle. It must not be
    # cached across deployments, otherwise a fresh index/bootstrap can still
    # launch an old UI even after service-worker caches are cleared.
    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 'ok';
    }
}
