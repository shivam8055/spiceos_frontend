<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cloud Kitchen Management System">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="spicebox">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>SpiceOS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    // Delivery-status release: force the browser to discard every old Flutter
    // shell/service-worker cache before loading the current application bundle.
    (async function () {
      const version = 'spiceos-web-20260826-delivery-status-v4';
      try {
        if (sessionStorage.getItem('__spiceos_web_version') !== version) {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map((name) => caches.delete(name)));
          }
          sessionStorage.setItem('__spiceos_web_version', version);
          const url = new URL(window.location.href);
          url.searchParams.set('__spiceos_release', version);
          window.location.replace(url.toString());
          return;
        }
      } catch (_) {
        // Never block the application if cache APIs are unavailable.
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?__spiceos_release=' + encodeURIComponent(version);
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
